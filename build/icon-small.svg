<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Simplified Shakery mark for 16 to 32 px icons: the black shaker silhouette and a single
       ribbon stroke, on a copper tile (the full logo is unreadable below 48 px, and the black
       shaker must never sit directly on a dark background). -->
  <defs>
    <radialGradient id="tile" cx="0.85" cy="0.1" r="1.15">
      <stop offset="0" stop-color="#F4B183" />
      <stop offset="0.35" stop-color="#EF782B" />
      <stop offset="1" stop-color="#A13817" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)" />
  <g transform="rotate(22 32 33)" fill="#120D0B">
    <rect x="28" y="5.5" width="8" height="5" rx="1.8" />
    <path d="M26.2 12h11.6l3.6 9.5H22.6z" />
    <path d="M21.4 23h21.2l1.6 22.5c0 6.4-5.4 11-12.2 11s-12.2-4.6-12.2-11z" />
  </g>
  <path d="M8.5 41c8-9 19 6 30.5-3.5 5-4.1 9.5-6 16.5-4.5" fill="none" stroke="#FFF1E6" stroke-width="4" stroke-linecap="round" />
</svg>
