appId: app.shakery.desktop
productName: Shakery
copyright: Shakery

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - resources/**
  - '!**/*.map'

asar: true
# better-sqlite3 ships Node-API prebuilds that load in Node and Electron alike: no rebuild
# for Electron's ABI (see docs/DECISIONS.md). Native binaries cannot load from inside the asar.
npmRebuild: false
asarUnpack:
  - '**/*.node'

# Section 6: fuses applied to the Electron binary at packaging time.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Code signing is prepared but not enabled: the decision belongs to the user (section 13.3).

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-${version}-setup.${ext}

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.lifestyle
  hardenedRuntime: true
  # No signing identity and no notarization until the user decides (section 13.3).
  identity: null
  notarize: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Releases on GitHub (D-051): the installer, its blockmap and latest.yml, read by electron-updater.
# Published by .github/workflows/release.yml when a v* tag is pushed; never from this PC.
publish:
  provider: github
  owner: YourHacktivist
  repo: Shakery
  releaseType: release
